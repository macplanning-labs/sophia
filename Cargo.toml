[workspace]
members = [".", "crates/auth-core", "crates/google-auth", "crates/mail-ingest", "crates/integration-core", "crates/store-gdrive", "crates/notify-gchat", "crates/cf-access-jwt", "crates/drive-core"]
resolver = "2"

[package]
name = "sophia"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SES受発注管理システム — 発注・受注・稼働報告・給与計算を一元管理（OSS ドンガラ）"
repository = "https://github.com/macplanning-labs/sophia"
# export_openapi 等の補助バイナリがあるため、`cargo run` の既定をアプリ本体に固定する
default-run = "sophia"

[features]
# 当社カスタマイズ（取引先ごとの連携）は公開版に含めない。src/custom/registry.rs が無いため custom は有効にできない
default = []
custom = []

[dependencies]
# 認証共通ライブラリ（公開ビルド用に crates/ へ同梱）
auth-core = { path = "crates/auth-core" }
# Google Workspace（サービスアカウント + ドメイン全体委任）認証共通ライブラリ
# （メール送信Gmail API移行(DEMO-000068)で実装したgoogle_auth.rsを切り出し）
google-auth = { path = "crates/google-auth" }
# auth_core::domain::jwt::TokenBlacklist トレイト実装に必要（auth-core側と同じ0.1系）
async-trait = "0.1"

# Web フレームワーク
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }

# OpenAPI スキーマ生成（utoipa）
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }


# データベース
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "rust_decimal", "migrate"] }

# メール送信
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# PDF生成


# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日時
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 精密な10進数計算（精算・給与）
rust_decimal = { version = "1", features = ["serde-with-str"] }

# パスワードハッシュ
bcrypt = "0.17"

# HMAC認証（Webhook検証）
hmac = "0.12"
sha2 = "0.10"
# トークンURLの {uuid} の復号(DEMO-000233 S2-E。Cargo.lock に既にある版と同じ)
percent-encoding = "2.3"
hex = "0.4"
subtle = "2.6"

# CLI
clap = { version = "4", features = ["derive"] }

# メールテンプレートレンダリング（DB保存テンプレート用）
tera = "1"

# ログ
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 環境変数
dotenvy = "0.15"

# Cookie のmax_age に必要
time = "0.3"

# エラーハンドリング
anyhow = "1"
thiserror = "2"

# MFA: TOTP（ワンタイムパスワード）
totp-rs = { version = "5", features = ["qr", "gen_secret"] }

# MFA: WebAuthn（パスキー）
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
url = "2"

# MFA: TOTP秘密鍵の暗号化保存
aes-gcm = "0.10"
rand = "0.8"

# Google Drive API用
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# 外部連携の部品（社内共通リポジトリの backend/rust/。DEMO-000210/000213）
#   integration-core: 保存する・知らせるの役割、必要な設定と点検、使う部品の一覧（integrations.toml）の照合
#   store-gdrive: 保存する部品（Google Drive・共有ドライブ対応。旧 drive-core の後継）
#   notify-gchat: 知らせる部品（Google Chat）
integration-core = { path = "crates/integration-core" }
store-gdrive = { path = "crates/store-gdrive" }
notify-gchat = { path = "crates/notify-gchat" }
# 社内 SSO（Cloudflare Access）の JWT 検証の部品（社内 SSO の共通リポジトリ company-sso の rust/cf-access-jwt。SOSSO / DEMO-000229）
#   署名・iss・aud・期限・メールドメインの検証に加え、JWT の取り出し（ヘッダー優先・Cookie の代用は Origin 完全一致のときだけ）も
#   部品が持つ（DEMO-000250）。アプリ側に Cookie や Origin の処理を書かない。
#   rev は P0 を含む main のコミットに固定する。部品を直したら rev を上げ、staging で確かめる（hash の逆引きは company-sso の履歴）。
cf-access-jwt = { path = "crates/cf-access-jwt" }

# Excel解析（稼働報告書自動読取り — EDI_MP excel_parser.py 移植）
calamine = "0.37"

# 正規表現
regex = "1"

# IMAP メール取得（受信メール自動取込 — EDI_MP email_receiver.py 移植）

# メール解析（MIMEヘッダーデコード・添付ファイル名抽出）
mailparse = "0.15"
# メール取込の共通部品（IMAP の読み取りと MIME の解読。社内共通リポジトリの backend/rust/mail-ingest）
mail-ingest = { path = "crates/mail-ingest" }

# 定期実行スケジューラ（メール取得ジョブ）
tokio-cron-scheduler = "0.13"

# PDFテキスト抽出（注文書/支払通知書PDF自動パース — EDI_MP order_pdf_parser.py 等の移植元）
pdf-extract = "0.12"
jpholiday = "0.2.0"


# DB結合テスト（tests/sql_contract.rs）: コードの中のSQLを、構文解析で取り出して、実DBに準備させる
[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
