# ============================================================
# nginx/local.conf — ローカル開発（本番と同じパス振り分け）
# ============================================================
# upstream: ホスト上の Rust(8119) / Next.js(3000)
# 入口: docker compose の nginx → localhost:8111

upstream backend {
    server host.docker.internal:8119;
}

upstream frontend {
    server host.docker.internal:3000;
}

map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost _;

    # Next.js 開発サーバの HMR（WebSocket）。これが通らないと、開発中の画面が
    # 正しく動作しない（ボタンが反応しない・データが読み込まれない）ため、ローカルのみ許可する。
    location /_next/hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }

    include /etc/nginx/sophia_locations.inc;
}
