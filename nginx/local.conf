# ============================================================
# nginx/local.conf — ローカル開発（本番と同じパス振り分け）
# ============================================================
# upstream: ホスト上の Rust(8119) / Next.js(3000)
# 入口: docker compose の nginx → localhost:8111

upstream backend {
    server host.docker.internal:8119;
}

upstream frontend {
    server host.docker.internal:3000;
}

map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost _;

    include /etc/nginx/sophia_locations.inc;
}
