# clippy.toml — 開発標準書 §2.3（#073再発防止）の機械的な検知設定
#
# async関数内で誤って呼ばれがちな「無期限にブロッキングしうる」標準ライブラリ呼び出しを
# 禁止する。tokio::task::spawn_blocking の中など、意図的に同期コンテキストで呼ぶ場合は
# 呼び出し箇所に `#[allow(clippy::disallowed_methods)]` を付けること。
disallowed-methods = [
    { path = "std::net::TcpStream::connect", reason = "タイムアウトなしで無期限にブロッキングしうる。TcpStream::connect_timeout を使うか、spawn_blocking で隔離すること（開発標準書§2.3, #073）" },
    { path = "std::thread::sleep", reason = "非同期コンテキストのスレッドを占有する。tokio::time::sleep を使うこと（開発標準書§2.3, #073）" },
]
