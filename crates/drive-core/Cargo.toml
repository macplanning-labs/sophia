[package]
name = "drive-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Google Drive連携共通ライブラリ（サービスアカウント認証 + フォルダ自動作成 + ファイルアップロード） — Sophia・将来の他システム共通基盤"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
