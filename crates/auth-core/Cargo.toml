[package]
name = "auth-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "認証共通ライブラリ（JWT / パスワード / TOTP / WebAuthn / レート制限・試行ロック） — WIP・Sophia・将来の他システム共通基盤"

[dependencies]
# Web フレームワーク連携（Extractor / ミドルウェア）
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"

# JWT
jsonwebtoken = "9"

# パスワードハッシュ
argon2 = "0.5"

# レガシーハッシュ移行（WIP: Django PBKDF2）
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"

# TOTP
totp-rs = { version = "5", features = ["qr"] }

# TOTP秘密鍵の暗号化保存
aes-gcm = "0.10"

# WebAuthn（パスキー）
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# webauthn-rsのpreludeがResidentKeyRequirementを再エクスポートしていないため直接依存させる
webauthn-rs-proto = "0.5"
url = "2"

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日時
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# ログ
tracing = "0.1"

# エラーハンドリング
thiserror = "2"

# 非同期トレイト（永続化系トレイトの定義に使用。auth-core自体はDB実装を持たない）
async-trait = "0.1"

# ランダム値生成（トークン・CSRF等）
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
