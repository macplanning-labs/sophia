[package]
name = "google-auth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Google Workspace サービスアカウント（ドメイン全体委任対応）JWT認証の共通ライブラリ"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
