[package]
name = "notify-gchat"
version = "0.1.0"
edition = "2021"
description = "知らせる部品: Google Chat(Incoming Webhook)"
license = "MIT"

[dependencies]
integration-core = { path = "../integration-core" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
