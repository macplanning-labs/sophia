# ============================================================
# docker-compose.dev.yml — ローカル開発用 nginx のみ
# ============================================================
# Rust / Next.js はホストで起動（./scripts/dev.sh）
# nginx だけ Docker で立て、本番と同じパス振り分けを使う
#
#   入口:     http://localhost:8111  → nginx
#   backend:  host.docker.internal:8119  (cargo run)
#   frontend: host.docker.internal:3000  (npm run dev)
# ============================================================

name: sophia-dev

services:
  nginx:
    image: nginx:alpine
    container_name: sophia-dev-nginx
    restart: unless-stopped
    ports:
      - "8111:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/sophia_locations.inc:/etc/nginx/sophia_locations.inc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
